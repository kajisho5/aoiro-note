baseURL = "/"
languageCode = "ja"
title = "aoiro-note"
theme = "PaperMod"
hasCJKLanguage = true
paginate = 10

[params]
  env = "production"
  description = "個人事業主・フリーランスのための青色申告とクラウド会計ソフト（freee／マネーフォワード／弥生）の実務メモ。"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  defaultTheme = "light"
  [params.homeInfoParams]
    Title = "青色申告と会計ソフト選びで、遠回りしないための実務メモ。"
    Content = "運営者自身が個人事業主として、実際にクラウド会計ソフトで請求・経費・確定申告を回しています。その実体験をもとに、ソフトの比較と青色申告の手順をまとめました。（デザイン案B：PaperMod）"
  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

[menu]
  [[menu.main]]
    name = "会計ソフト比較"
    url = "/articles/freee-mf-yayoi-hikaku/"
    weight = 1
  [[menu.main]]
    name = "青色申告ガイド"
    url = "/articles/aoiro-shinkoku-guide/"
    weight = 2
  [[menu.main]]
    name = "運営者情報"
    url = "/about/"
    weight = 3

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
